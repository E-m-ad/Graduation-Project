<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | AI Rent</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body data-page="reset-password">
    <header class="site-header">
      <a class="brand" href="/">AI Rent</a>
      <nav class="site-nav">
        <a href="/" data-nav="home" data-non-admin-only>Home</a>
        <a href="/html/products.html" data-nav="products" data-non-admin-only>
          Browse
        </a>
        <a href="/html/login.html" data-guest-only>Login</a>
      </nav>
    </header>

    <main class="page-shell auth-page">
      <section class="auth-layout auth-layout--compact">
        <article class="auth-intro">
          <p class="eyebrow">Set a new password</p>
          <h1>Finish the recovery flow.</h1>
          <p>
            Paste the reset token and choose a new password that includes at
            least one uppercase letter and one number.
          </p>
        </article>

        <section class="auth-card">
          <div class="auth-card__header">
            <h2>Reset Password</h2>
            <p>Complete the final step for your account.</p>
          </div>

          <form id="resetPasswordForm" class="stack-form" novalidate>
            <div class="field">
              <label for="resetToken">Reset token</label>
              <input
                id="resetToken"
                name="token"
                type="text"
                class="input"
                placeholder="Paste your reset token"
              />
              <p class="field-error" id="tokenError"></p>
            </div>

            <div class="field">
              <label for="newPassword">New password</label>
              <input
                id="newPassword"
                name="password"
                type="password"
                class="input"
                placeholder="Choose a new password"
              />
              <p class="field-error" id="passwordError"></p>
            </div>

            <div class="field">
              <label for="confirmNewPassword">Confirm new password</label>
              <input
                id="confirmNewPassword"
                name="confirmPassword"
                type="password"
                class="input"
                placeholder="Repeat your new password"
              />
              <p class="field-error" id="confirmPasswordError"></p>
            </div>

            <button
              type="submit"
              class="btn btn--primary btn--full"
              id="resetPasswordBtn"
            >
              Reset Password
            </button>
            <p class="message" id="formMessage"></p>
          </form>
        </section>
      </section>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/reset-password.js"></script>
  </body>
</html>
