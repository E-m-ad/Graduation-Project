<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Listings | AI Rent</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/my-listings.css" />
  </head>
  <body data-page="my-listings">
    <header class="site-header">
      <a class="brand" href="/">AI Rent</a>
      <nav class="site-nav">
        <a href="/" data-nav="home" data-non-admin-only>Home</a>
        <a href="/html/products.html" data-nav="products" data-non-admin-only>
          Browse
        </a>
        <a href="/html/admin-dashboard.html" data-nav="admin" data-admin-only hidden>
          Admin Dashboard
        </a>
        <a href="/html/my-listings.html" data-nav="my-listings" data-user-only hidden>
          My Listings
        </a>
        <a href="/html/profile.html" data-nav="profile" data-user-only hidden>
          Profile
        </a>
        <button type="button" class="btn btn--ghost" data-logout-button hidden>
          Logout
        </button>
      </nav>
    </header>

    <main class="page-shell">
      <section class="page-hero">
        <div>
          <p class="eyebrow">Owner workspace</p>
          <h1>Create and manage your listings.</h1>
          <p>
            The form stays close to the existing backend schema so the front-end
            remains easy to understand and extend.
          </p>
        </div>
      </section>

      <p class="message" id="listingMessage"></p>

      <section class="listing-layout">
        <article class="surface-panel">
          <div class="section-heading section-heading--compact">
            <div>
              <p class="eyebrow">New listing</p>
              <h2>Create a product</h2>
            </div>
          </div>

          <form id="createListingForm" class="form-grid">
            <div class="field">
              <label for="listingCategory">Category</label>
              <select id="listingCategory" name="categoryId" class="input">
                <option value="">Choose a category</option>
              </select>
            </div>

            <div class="field">
              <label for="listingTitle">Title</label>
              <input id="listingTitle" name="title" type="text" class="input" />
            </div>

            <div class="field field--full">
              <label for="listingDescription">Description</label>
              <textarea
                id="listingDescription"
                name="description"
                class="textarea"
                rows="4"
              ></textarea>
            </div>

            <div class="field">
              <label for="pricePerHour">Price per hour</label>
              <input id="pricePerHour" name="pricePerHour" type="number" min="0" step="0.01" class="input" />
            </div>

            <div class="field">
              <label for="pricePerDay">Price per day</label>
              <input id="pricePerDay" name="pricePerDay" type="number" min="0" step="0.01" class="input" />
            </div>

            <div class="field">
              <label for="pricePerWeek">Price per week</label>
              <input id="pricePerWeek" name="pricePerWeek" type="number" min="0" step="0.01" class="input" />
            </div>

            <div class="field">
              <label for="pricePerMonth">Price per month</label>
              <input id="pricePerMonth" name="pricePerMonth" type="number" min="0" step="0.01" class="input" />
            </div>

            <div class="field">
              <label for="securityDeposit">Security deposit</label>
              <input
                id="securityDeposit"
                name="securityDeposit"
                type="number"
                min="0"
                step="0.01"
                class="input"
              />
            </div>

            <div class="field">
              <label for="listingCity">City</label>
              <input id="listingCity" name="city" type="text" class="input" />
            </div>

            <div class="field">
              <label for="listingCondition">Condition</label>
              <select id="listingCondition" name="condition" class="input">
                <option value="">Select condition</option>
                <option value="new">New</option>
                <option value="like_new">Like new</option>
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="fair">Fair</option>
              </select>
            </div>

            <div class="field">
              <label for="minRentalPeriod">Minimum rental period</label>
              <input
                id="minRentalPeriod"
                name="minRentalPeriod"
                type="number"
                min="1"
                class="input"
              />
            </div>

            <div class="field">
              <label for="maxRentalPeriod">Maximum rental period</label>
              <input
                id="maxRentalPeriod"
                name="maxRentalPeriod"
                type="number"
                min="1"
                class="input"
              />
            </div>

            <div class="field field--full">
              <label for="locationAddress">Address</label>
              <input id="locationAddress" name="locationAddress" type="text" class="input" />
            </div>

            <div class="field field--full">
              <label for="listingTags">Tags</label>
              <input
                id="listingTags"
                name="tags"
                type="text"
                class="input"
                placeholder="camera, canon, travel"
              />
            </div>

            <div class="field field--full">
              <label for="listingTerms">Terms and conditions</label>
              <textarea id="listingTerms" name="termsConditions" class="textarea" rows="4"></textarea>
            </div>

            <div class="field field--full">
              <label for="listingImages">Product images</label>
              <input
                id="listingImages"
                name="images"
                type="file"
                class="input"
                accept="image/*"
                multiple
              />
            </div>

            <div class="field field--full">
              <button type="submit" class="btn btn--primary">Create Listing</button>
            </div>
          </form>
        </article>

        <section class="surface-panel">
          <div class="section-heading section-heading--compact">
            <div>
              <p class="eyebrow">Your listings</p>
              <h2>Manage status and review state</h2>
            </div>
            <div class="compact-filter">
              <label for="statusFilter">Status</label>
              <select id="statusFilter" class="input">
                <option value="">All statuses</option>
                <option value="available">Available</option>
                <option value="unavailable">Unavailable</option>
                <option value="under_review">Under review</option>
                <option value="suspended">Suspended</option>
                <option value="rented">Rented</option>
              </select>
            </div>
          </div>

          <div class="list-stack" id="myListingsList"></div>
        </section>
      </section>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/my-listings.js"></script>
  </body>
</html>
